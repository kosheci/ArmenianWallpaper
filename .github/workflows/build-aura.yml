name: Build Astuats Arasce Aura
on:
  push:
    branches: [arasce-aura]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        working-directory: aura
        run: gradle --no-daemon --console=plain assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Astuats-Arasce-Aura-apk
          path: aura/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
