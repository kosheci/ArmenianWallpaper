name: Recover Astuats-Arasce 1.3 sources
on:
  workflow_dispatch:
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify original APK
        run: |
          test -s Astuats-Arasce-1.3.apk
          unzip -t Astuats-Arasce-1.3.apk
          unzip -p Astuats-Arasce-1.3.apk classes.dex > /dev/null
      - name: Install JADX
        run: |
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o jadx.zip
          mkdir jadx
          unzip -q jadx.zip -d jadx
      - name: Decompile original APK
        run: |
          mkdir -p recovery/output
          jadx/bin/jadx --show-bad-code -d recovery/output Astuats-Arasce-1.3.apk
      - name: Upload recovered sources
        uses: actions/upload-artifact@v4
        with:
          name: arasce-1.3-decompiled
          path: recovery/output/
          if-no-files-found: error
