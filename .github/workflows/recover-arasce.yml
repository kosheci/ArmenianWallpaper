name: Recover Astuats-Arasce 1.3 sources
on:
  push:
    branches: [arasce-1.4-recovery]
    paths: ['.github/workflows/recover-arasce.yml']
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Optional HTTPS URL to the original Astuats-Arasce-1.3.apk'
        required: false
        type: string
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate original APK
        env:
          APK_URL: ${{ inputs.apk_url || 'https://raw.githubusercontent.com/kosheci/ArmenianWallpaper/main/Astuats-Arasce-1.3.apk' }}
        run: |
          mkdir -p recovery
          if [ -f recovery/Astuats-Arasce-1.3.apk ]; then
            echo 'Using committed original APK'
          elif [ -n "$APK_URL" ]; then
            case "$APK_URL" in https://*) ;; *) echo 'Only HTTPS URLs are allowed'; exit 1;; esac
            curl -fL --retry 3 "$APK_URL" -o recovery/Astuats-Arasce-1.3.apk
          else
            echo 'Original APK missing: commit recovery/Astuats-Arasce-1.3.apk or provide an HTTPS URL'
            exit 1
          fi
          unzip -t recovery/Astuats-Arasce-1.3.apk
          unzip -p recovery/Astuats-Arasce-1.3.apk classes.dex > /dev/null
      - name: Install JADX
        run: |
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o jadx.zip
          mkdir jadx && unzip -q jadx.zip -d jadx
      - name: Decompile original APK
        run: |
          mkdir -p recovery/output
          jadx/bin/jadx --show-bad-code -d recovery/output recovery/Astuats-Arasce-1.3.apk
      - name: Upload recovered sources
        uses: actions/upload-artifact@v4
        with:
          name: arasce-1.3-decompiled
          path: recovery/output/
