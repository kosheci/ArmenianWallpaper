name: Build Astuats Arasce Luys 3D
on:
  push:
    branches: [arasce-luys-3d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check battery and lunar calculations
        run: |
          mkdir -p /tmp/luys-check
          javac -d /tmp/luys-check luys3d/app/src/main/java/am/arasce/wallpaper/VisualEffects14.java luys3d/checks/Check.java
          java -cp /tmp/luys-check Check
      - name: Build APK
        working-directory: luys3d
        run: gradle --no-daemon --console=plain assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Astuats-Arasce-Luys-3D-apk
          path: luys3d/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
