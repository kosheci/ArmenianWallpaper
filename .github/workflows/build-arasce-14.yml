name: Build Astuats-Arasce 1.4 from recovered original
on:
  push:
    branches: [arasce-1.4-build]
    paths: ['.github/workflows/build-arasce-14.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Get latest successful recovered original sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow recover-arasce.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID" && test "$RUN_ID" != null
          mkdir -p recovered
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name arasce-1.3-decompiled --dir recovered
          find recovered -maxdepth 3 -type f | head -30
      - name: Validate restored source and resources
        run: |
          test -f recovered/sources/am/arasce/wallpaper/ArasceRenderer.java
          test -f recovered/sources/am/arasce/wallpaper/ArasceWallpaperService.java
          test -f recovered/resources/AndroidManifest.xml
      - name: Reconstruct original Android app and apply 1.4 fixes
        shell: bash
        run: |
          mkdir -p arasce14/app/src/main/java/am/arasce/wallpaper arasce14/app/src/main
          cp recovered/sources/am/arasce/wallpaper/*.java arasce14/app/src/main/java/am/arasce/wallpaper/
          rm -f arasce14/app/src/main/java/am/arasce/wallpaper/R.java
          cp -r recovered/resources/res arasce14/app/src/main/res
          cp recovered/resources/AndroidManifest.xml arasce14/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path
          root=Path('arasce14')
          manifest=root/'app/src/main/AndroidManifest.xml'
          s=manifest.read_text()
          for a in ('android:compileSdkVersion="29"','android:compileSdkVersionCodename="10"','platformBuildVersionCode="29"','platformBuildVersionName="10"'):
              s=s.replace(a,'')
          s=s.replace('android:versionCode="4"','android:versionCode="5"').replace('android:versionName="1.3"','android:versionName="1.4"')
          manifest.write_text(s)
          p=root/'app/src/main/java/am/arasce/wallpaper/ArasceWallpaperService.java'
          s=p.read_text().replace('super(ArasceWallpaperService.this);', 'super();').replace('this.holdReveal = this.holdReveal ? false : true;','this.holdReveal = !this.holdReveal;')
          s=s.replace('(this.holdReveal || fNow - this.touchAt < 2.5f) ? 1.0f : 0.0f','this.holdReveal ? 1.0f : 0.0f')
          p.write_text(s)
          p=root/'app/src/main/java/am/arasce/wallpaper/ArasceRenderer.java'
          s=p.read_text().replace('this.map.drawLines(canvas, fMax, fSin);','this.map.drawLines(canvas, f4, fSin);')
          s=s.replace('(0.28f + (0.2f * fSin) + (0.52f * fMax))','(0.12f + (0.12f * fSin) + (0.26f * fMax))')
          p.write_text(s)
          (root/'settings.gradle').write_text("pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name='AstuatsArasce'\ninclude ':app'\n")
          (root/'build.gradle').write_text("plugins { id 'com.android.application' version '8.5.2' apply false }\n")
          (root/'app/build.gradle').write_text("plugins { id 'com.android.application' }\nandroid { namespace 'am.arasce.wallpaper'; compileSdk 35; defaultConfig { applicationId 'am.arasce.wallpaper'; minSdk 28; targetSdk 29; versionCode 5; versionName '1.4' }; compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }\n")
          (root/'gradle.properties').write_text("org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8\n")
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build Android APK
        working-directory: arasce14
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee ../build-log.txt
      - name: Summarize compilation errors
        if: failure()
        shell: bash
        run: |
          echo '## Astuats-Arasce 1.4 — причина ошибки сборки' >> "$GITHUB_STEP_SUMMARY"
          echo '### Найденные сообщения компилятора' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
          grep -E -A 8 -B 3 '(^FAILURE:|^\* What went wrong:|^> | error:|^e: |Execution failed for task|Could not |A problem occurred|Manifest merger failed|Android resource linking failed)' build-log.txt | head -160 >> "$GITHUB_STEP_SUMMARY" || true
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Полный журнал доступен как build-log.txt в артефактах.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arasce-1.4-build-error-log
          path: build-log.txt
          if-no-files-found: warn
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Astuats-Arasce-1.4-debug-apk
          path: arasce14/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload reconstructed sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arasce-1.4-reconstructed-project
          path: arasce14/
          if-no-files-found: warn
